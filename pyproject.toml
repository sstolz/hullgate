[project]
name = "hullgate"
version = "1.0.0"
description = "Compartmentalized MCP gateway (v1) — F-004 foundation: two listeners, probes, SQLite database, backup."
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
    # MCP SDK pinned by exact equality (ADR-001 condition 1, BR-036); any upgrade goes through
    # `make bench-sdk` (BR-037).
    "mcp==2.3.0",
    # Versions of the Python POC judged by the bench (F-003).
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    # F-005 lot B: RFC 9068 JWT access tokens signed ES256 (BR-054), mounted secrets. Versions
    # already locked as SDK dependencies, declared directly since the v1 imports them.
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    # F-016 lot A: WebAuthn ceremonies of the admin console (BR-202), py_webauthn, BSD-3-Clause.
    "webauthn==3.0.1",
    "pyyaml==6.0.3",
]

[project.scripts]
# Administration CLI in the container (F-005, SCR-02); without arguments, the gateway.
hullgate = "hullgate.__main__:entry"

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy==2.4.0",
    "pytest==9.2.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.6"

[tool.ruff]
line-length = 100
target-version = "py313"
# The v1 gate covers src/, tests/, scripts/; the witness POCs and the act evidence keep
# their form (the SDK guard, BR-037, reads the evidence of the bench's v1 target).
extend-exclude = ["poc", ".cairn", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S108"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "scripts"]
mypy_path = "src:scripts:tests/browser"
explicit_package_bases = true

[[tool.mypy.overrides]]
# F-016: tests/browser runs in the pinned Playwright image (make test-browser); its packages are
# not in the gate's environment, so their names are typed `Any` here.
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers"
markers = [
    "container: tests of the image and of the composition (Docker required)",
    "audit_sweep: sweep of the audit entries of the whole suite (BR-066, run last)",
]

[tool.coverage.run]
source = ["src"]
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"
