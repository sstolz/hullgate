# The quality gate on every change (BR-341): `make gate`, then `make qa`, on GitHub-hosted
# runners, read-only, with no secret. Third-party actions are pinned by full commit SHA and
# updated by hand.
name: gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history and tags: the BR-350 guard reads the tree of tag v1.0.0.
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The version pinned by `[tool.uv] required-version` in pyproject.toml.
      - name: Install uv
        run: pipx install uv==0.13.6
      - name: make gate
        run: make gate
      - name: make qa
        run: make qa
