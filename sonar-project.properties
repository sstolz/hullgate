# SonarQube scanner configuration (F-007, BR-104). No secret: the token is read by
# `make sonar` from SONAR_TOKEN or SONAR_TOKEN_FILE; host from SONAR_HOST_URL (BR-105).
sonar.projectKey=hullgate
sonar.projectName=hullgate
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
# The scanner does not receive the repository (nor .git) and runs under the session's UID: no git blame.
sonar.scm.disabled=true
# The scanner receives only src/, tests/, this file and coverage.xml, read-only: its
# working directory is outside the mounted repository.
sonar.working.directory=/tmp/.scannerwork
