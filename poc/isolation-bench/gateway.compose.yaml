# Banc d'isolation, cible « gateway » (F-002). Images épinglées par digest (BR-005).
# Secrets : .run/env, généré à chaque lancement (BR-010).
# Réseaux (BR-016) : `internal` n'a aucune sortie ; Gitea et le serveur MCP Gitea n'y sont qu'attachés.
# `edge` permet de publier sur 127.0.0.1 pour l'exécuteur : la passerelle, l'amont du banc et la frontale y sont aussi.
name: isolation-bench

networks:
  internal: { internal: true }
  edge: {}

services:
  upstream:
    image: python@sha256:b3575dcf816cdacc5292df77a6e3e59b8941631078373a045efa2ac1e9c5c3b2
    command: ["python", "-u", "/srv/server.py"]
    volumes: ["./upstream:/srv:ro"]
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${UP_PORT:-19100}:9100"
      - "127.0.0.1:${UP_CONTROL_PORT:-19101}:9101"
    environment:
      UP_CONTROL_TOKEN: ${UP_CONTROL_TOKEN}
      UP_CLIENT_ID_1: bench-client-1
      UP_CLIENT_SECRET_1: ${UP_CLIENT_SECRET_1}
      UP_CLIENT_ID_2: bench-client-2
      UP_CLIENT_SECRET_2: ${UP_CLIENT_SECRET_2}
      ACCESS_TTL: "3600"
    healthcheck:
      # connexion TCP sans requête HTTP : une sonde HTTP serait journalisée (BR-013) et polluerait les fenêtres de test
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('localhost',9100),2).close()"]
      interval: 2s
      retries: 30

  gateway:
    build: { context: ../go-gateway }
    image: isolation-bench-gateway:poc
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${GW_PORT:-18100}:8080"
      - "127.0.0.1:${GW_ADMIN_PORT:-18102}:8081"   # administration : 127.0.0.1 seulement
    environment:
      PUBLIC_BASE: http://localhost:${GW_PORT:-18100}
      ADMIN_TOKEN: ${GW_ADMIN_TOKEN}
      ACCESS_TTL_SECONDS: "86400"        # = policy.json access_token_lifetime_seconds
    depends_on: { upstream: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 2s
      retries: 30

  gitea:
    image: gitea/gitea@sha256:a664a64d7740ef0db74f090f567040d0e5b34592473aad08ed5e296ccbe00eab
    networks: [internal]
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DOMAIN: gitea
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__mailer__ENABLED: "false"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 3s
      retries: 60

  # démarrés après la création du jeton Gitea jetable (profil « late », voir l'adaptateur)
  gitea-mcp:
    profiles: ["late"]
    image: docker.gitea.com/gitea-mcp-server@sha256:ccdb5660ecdf54c5e480f10cc8120ba2bf150b582cea8a1974de2e59883582d3
    # -H obligatoire : le défaut est un hôte public (BR-016). Aucun jeton au démarrage : le jeton de la connexion arrive
    # par requête (en-tête Authorization posé par la passerelle), seul chemin d'authentification, lu sur la frontale (BR-022).
    command: ["/app/gitea-mcp", "-t", "http", "-H", "http://gitea:3000", "-p", "8080"]
    networks: [internal]

  front:
    profiles: ["late"]
    image: python@sha256:b3575dcf816cdacc5292df77a6e3e59b8941631078373a045efa2ac1e9c5c3b2
    command: ["python", "-u", "/srv/front.py"]
    volumes: ["./front:/srv:ro"]
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${FRONT_PORT:-19200}:8080"
      - "127.0.0.1:${FRONT_CONTROL_PORT:-19201}:9201"
    environment:
      FRONT_UPSTREAM: gitea-mcp:8080
      FRONT_CONTROL_TOKEN: ${FRONT_CONTROL_TOKEN}
